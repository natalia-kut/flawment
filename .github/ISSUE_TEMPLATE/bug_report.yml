name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. Add a screenshot if it helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as a coordinator
        2. Open a project
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - flawment.vercel.app
        - Local development
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and system
      placeholder: Chrome on Windows 11
