
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: flawment
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: test
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d flawment"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
